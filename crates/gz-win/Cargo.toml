[package]
name = "gz-win"
description = "GamingZones Win32 layer: every unsafe call lives here, behind safe functions."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
gz-core.workspace = true

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
